name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,pdf]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: The configuration appendix matches the code
        run: python -m tools.gen_config_doc --check
      - name: Links, anchors and named paths of the Markdown files resolve
        run: python -m tools.check_links
